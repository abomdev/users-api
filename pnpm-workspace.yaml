# Aplicaciones del monorepo. Cada una tiene su package.json y sus dependencias;
# pnpm mantiene un unico lockfile en la raiz y un unico almacen de paquetes, asi
# que lo que las dos comparten se descarga y se guarda una sola vez.
packages:
  - apps/*

# ---------------------------------------------------------------------------

# pnpm 11 bloquea por defecto los scripts de instalacion de las dependencias.
# Es una proteccion contra codigo malicioso en postinstall: si no se aprueba
# explicitamente, el script no corre.
#
# Prisma y SWC NECESITAN el suyo para bajar sus binarios nativos. Sin esta
# aprobacion, `prisma generate` falla y hasta `pnpm exec` aborta.
#
# Ojo: hasta pnpm 10 esto se declaraba como "onlyBuiltDependencies" dentro de
# package.json. En pnpm 11 esa clave se ignora (avisa con un warning) y la
# configuracion vive aca. La mayoria de la documentacion sigue desactualizada.
allowBuilds:
  '@prisma/engines': true
  '@swc/core': true
  prisma: true

  # Telemetria que viene arrastrada por @nestjs/swagger. Su script de
  # instalacion reporta datos de uso a un servidor externo. No aporta nada al
  # funcionamiento de la libreria, asi que se deniega. Dejarlo anotado en false
  # (y no borrar la linea) evita que pnpm vuelva a preguntar en cada install.
  '@scarf/scarf': false

  # Resolvedor de modulos nativo que usa jest-resolve en Jest 30. Su postinstall
  # enlaza el binario que corresponde a esta plataforma: sin el, Jest no
  # resuelve imports. Es funcional, no telemetria.
  unrs-resolver: true
