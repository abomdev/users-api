services:
  db:
    image: postgres:17-alpine
    container_name: users-api-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Se publica al host para poder usar Prisma Studio y psql desde afuera
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Volumen con nombre: los datos sobreviven a `docker compose down`.
      # Para borrarlos de verdad hace falta `docker compose down -v`.
      - users-api-pgdata:/var/lib/postgresql/data
    healthcheck:
      # Sin esto, el contenedor figura "arriba" antes de que Postgres acepte
      # conexiones, y la primera migracion falla por carrera.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  users-api-pgdata:
