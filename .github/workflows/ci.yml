name: CI

on:
  push:
    branches: [main]
  pull_request:

# Si se empuja dos veces seguidas, cancela la ejecucion anterior en lugar de
# gastar minutos en un commit que ya quedo viejo.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.1.2'

jobs:
  verify:
    name: Lint, build y tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        # Tienen que coincidir con el DATABASE_URL de .env.test, que es el que
        # usan los tests end to end.
        env:
          POSTGRES_USER: users_api
          POSTGRES_PASSWORD: postgres_local
          POSTGRES_DB: users_api_test
        ports:
          - 5432:5432
        # Sin el healthcheck, los tests pueden arrancar antes de que Postgres
        # acepte conexiones y fallar por una carrera, no por un bug.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Cachea el store de pnpm entre ejecuciones: la instalacion pasa de
          # minutos a segundos cuando el lockfile no cambio.
          cache: pnpm

      - name: Instalar dependencias
        # --frozen-lockfile falla si package.json y el lockfile no coinciden,
        # en lugar de resolver versiones nuevas en silencio. En CI se quiere
        # exactamente lo que se probo en local, no "lo ultimo que haya".
        run: pnpm install --frozen-lockfile
        env:
          # El postinstall corre `prisma generate`, y prisma.config.ts exige la
          # variable. Generar no se conecta a la base.
          DATABASE_URL: postgresql://users_api:postgres_local@localhost:5432/users_api_test?schema=public

      - name: Lint
        run: pnpm --filter api lint

      - name: Compilar
        run: pnpm --filter api build

      - name: Tests unitarios
        run: pnpm --filter api test

      - name: Tests end to end
        # Levanta la aplicacion completa contra el Postgres de arriba. Las
        # migraciones las aplica el globalSetup de Jest.
        run: pnpm --filter api test:e2e

  docker:
    name: Imagen Docker de la API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          # El contexto es la raiz del monorepo, donde vive el lockfile.
          context: .
          file: apps/api/Dockerfile
          target: runtime
          # No se publica en ningun registro: el objetivo es detectar que el
          # Dockerfile dejo de construir, no distribuir la imagen.
          push: false
          load: true
          tags: users-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comprobar que la imagen arranca y valida su configuracion
        # Sin variables de entorno la aplicacion debe negarse a arrancar con un
        # mensaje claro. Que falle asi confirma dos cosas: que la imagen
        # ejecuta, y que la validacion de configuracion sigue viva.
        run: |
          salida=$(docker run --rm users-api:ci 2>&1 || true)
          echo "$salida"
          echo "$salida" | grep -q "Configuracion invalida" \
            && echo "OK: la imagen arranca y valida su configuracion" \
            || (echo "FALLO: se esperaba el error de configuracion invalida"; exit 1)
